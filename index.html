<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>
<body>
    <div id="calculator">
        <div id="header">
            <h1 id="calcTitle">Calculator</h1>
            <div>
                <h1 id="historyTitle">History</h1>
            </div>
        </div>

        <div id="type_btn-Wrapper">
            <div id="typeFrame-Wrapper">
                <p id="display-equation">test</p>
                <h1 id="display-num"></h1>
            </div>
            <div id="btnFrame-Wrapper">
                <button class="operator-btn grey-btn" onclick="clickBtn(this)">%</button>
                <button class="clearentry-btn grey-btn" onclick="clickBtn(this)">CE</button>
                <button class="clear-btn grey-btn" onclick="clickBtn(this)">C</button>
                <button class="backspace-btn grey-btn" onclick="clickBtn(this)"><ion-icon name="backspace-outline"></ion-icon></button>
                <button class="operator-btn grey-btn" onclick="clickBtn(this)"><sup>1</sup>/<sub>x</sub></button>
                <button class="operator-btn grey-btn" onclick="clickBtn(this)">x<sup>2</sup></button>
                <button class="operator-btn grey-btn" onclick="clickBtn(this)">&radic;x</button>
                <button class="operator-btn grey-btn" onclick="clickBtn(this)">/</button>
                <button class="number-btn" onclick="clickBtn(this)">7</button>
                <button class="number-btn" onclick="clickBtn(this)">8</button>
                <button class="number-btn" onclick="clickBtn(this)">9</button>
                <button class="operator-btn grey-btn" onclick="clickBtn(this)">x</button>
                <button class="number-btn" onclick="clickBtn(this)">4</button>
                <button class="number-btn" onclick="clickBtn(this)">5</button>
                <button class="number-btn" onclick="clickBtn(this)">6</button>
                <button class="operator-btn grey-btn" onclick="clickBtn(this)">-</button>
                <button class="number-btn" onclick="clickBtn(this)">1</button>
                <button class="number-btn" onclick="clickBtn(this)">2</button>
                <button class="number-btn" onclick="clickBtn(this)">3</button>
                <button class="operator-btn grey-btn" onclick="clickBtn(this)">+</button>
                <button class="operator-btn" id="posNeg" onclick="clickBtn(this)">+/-</button>
                <button class="number-btn" onclick="clickBtn(this)">0</button>
                <button class="number-btn" onclick="clickBtn(this)">.</button>
                <button class="equal-btn" onclick="clickBtn(this)">=</button>
            </div>
        </div>
        <div id="historyFrame-Wrapper">
            
        </div>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="script.js"></script>
</body>
</html>
